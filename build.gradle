plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "real_serene_seasons" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:serene-seasons:${project.serene_seasons_version}"
    implementation "maven.modrinth:glitchcore:${project.glitchcore_version}"

    implementation "com.electronwill.night-config:core:${project.nightconfig_version}"
    implementation "com.electronwill.night-config:toml:${project.nightconfig_version}"
    include "com.electronwill.night-config:core:${project.nightconfig_version}"
    include "com.electronwill.night-config:toml:${project.nightconfig_version}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    // For local testing, uncomment to open the config UI without installing manually:
    // runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
